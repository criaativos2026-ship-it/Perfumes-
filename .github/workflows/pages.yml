# Publica o app no GitHub Pages (gratuito). Ative em Settings > Pages > Source: GitHub Actions.
name: Publicar app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: node --test tests/*.test.mjs
      - name: Montar site
        run: |
          mkdir -p _site/brand
          cp -r web/. _site/
          cp brand/CLAUDE.md _site/brand/CLAUDE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
